name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          response=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response status: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 500 ]; then
            echo "Ping failed with status $response"
            exit 1
          fi
          echo "Supabase project is alive."
